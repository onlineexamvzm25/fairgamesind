<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Play With Friends</title>

    <link rel="stylesheet" href="tablepage.css">
</head>

<body>
<div id="rotateDeviceOverlay">
  <div class="rotate-message">
    <div class="rotate-icon">📱↻</div>
    <div>Please rotate your phone</div>
    <small>This page is designed for landscape mode</small>
  </div>
</div>


<div class="page-container">

    <h1>PLAY WITH FRIENDS</h1>


    <!-- ==========================================
         MAIN OPTIONS
         ========================================== -->

    <div id="mainOptions">


        <button
            type="button"
            class="option-button"
            onclick="showCreateTable()"
        >
            CREATE TABLE FOR FRIENDS
        </button>


        <button
            type="button"
            class="option-button"
            onclick="showJoinTable()"
        >
            JOIN FRIENDS TABLE
        </button>

        
        <button
        type="button"
        class="home-button"
        onclick="location.href='index.html'"
    >
        🏠 HOME
       </button>

    </div>


    <!-- ==========================================
         CREATE TABLE
         ========================================== -->

    <div
        id="createSection"
        class="card hidden"
    >

        <div class="section-heading">
            <button
                type="button"
                class="section-back"
                onclick="showMainOptions()"
                aria-label="Back"
            >←</button>
            <h2>CREATE TABLE FOR FRIENDS</h2>
        </div>

        <div class="compact-field">
            <label for="hostName">Player Name</label>
            <input
                type="text"
                id="hostName"
                maxlength="15"
                placeholder="Loading account..."
                autocomplete="off"
                readonly
            >
        </div>

        <div class="compact-field">
            <label for="hostPhone">Phone Number</label>
            <input
                type="tel"
                id="hostPhone"
                maxlength="10"
                inputmode="numeric"
                placeholder="Loading account..."
                autocomplete="off"
                readonly
            >
        </div>


        <label>
            Select Pool
        </label>

        <div class="pool-options">

            <label class="pool-option">

                <input
                    type="radio"
                    name="poolType"
                    value="201"
                    checked
                >

                <span>201 POOL</span>

            </label>


            <label class="pool-option">

                <input
                    type="radio"
                    name="poolType"
                    value="101"
                >

                <span>101 POOL</span>

            </label>

        </div>


        <button
            type="button"
            class="main-button"
            onclick="createTable()"
        >
            CREATE NEW TABLE
        </button>



    </div>


    <!-- ==========================================
         JOIN TABLE
         ========================================== -->

    <div
        id="joinSection"
        class="card hidden"
    >

        <div class="section-heading">
            <button
                type="button"
                class="section-back"
                onclick="showMainOptions()"
                aria-label="Back"
            >←</button>
            <h2>JOIN FRIENDS TABLE</h2>
        </div>

        <div class="compact-field">
            <label for="joinTableId">Table ID</label>
            <input
                type="number"
                id="joinTableId"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter table ID"
            >
        </div>

        <div class="compact-field">
            <label for="joinPlayerName">Player Name</label>
            <input
                type="text"
                id="joinPlayerName"
                maxlength="15"
                placeholder="Loading account..."
                autocomplete="off"
                readonly
            >
        </div>


        <button
            type="button"
            class="main-button"
            onclick="joinFriendTable()"
        >
            JOIN TABLE
        </button>



    </div>


    <!-- ==========================================
         MESSAGE
         ========================================== -->

    <div id="message"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="tablepage.js"></script>

</body>
</html>
